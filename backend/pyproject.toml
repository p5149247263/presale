[project]
name = "ai-presales-copilot-backend"
version = "0.1.0"
description = "AI Presales Copilot backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "numpy>=1.26.0",
  "jinja2>=3.1.4",
  "reportlab>=4.2.2",
  "pydantic-settings>=2.4.0",
  "cryptography>=43.0.0"
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8.0"]
test = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
